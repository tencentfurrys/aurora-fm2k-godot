<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VoxelCraft - Minecraft Clone</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #87ceeb; font-family: "Segoe UI", system-ui, sans-serif; }
  #crosshair { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 20px; height: 20px; pointer-events: none; z-index: 10; }
  #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #fff; opacity: .9; box-shadow: 0 0 2px #000; }
  #crosshair::before { left: 9px; top: 0; width: 2px; height: 20px; }
  #crosshair::after { top: 9px; left: 0; height: 2px; width: 20px; }
  #hotbar { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; padding: 6px; background: rgba(0,0,0,.4); border-radius: 10px; z-index: 10; backdrop-filter: blur(2px); }
  .slot { width: 52px; height: 52px; border: 2px solid rgba(255,255,255,.35); border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; font-size: 10px; cursor: pointer; background: rgba(0,0,0,.25); position: relative; user-select: none; }
  .slot.selected { border-color: #ffeb3b; box-shadow: 0 0 10px #ffeb3b, inset 0 0 6px rgba(255,235,59,.3); }
  .slot .icon { width: 30px; height: 30px; border-radius: 4px; border: 1px solid rgba(0,0,0,.4); image-rendering: pixelated; }
  .slot .num { position: absolute; top: 2px; left: 4px; font-size: 10px; font-weight: bold; text-shadow: 0 0 3px #000; }
  .slot .label { font-size: 9px; opacity: .9; text-shadow: 0 0 3px #000; }
  #info { position: fixed; top: 10px; left: 10px; color: #fff; text-shadow: 0 0 4px #000; z-index: 10; font-size: 12px; line-height: 1.4; pointer-events: none; }
  #menu { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.65); z-index: 30; color: #fff; flex-direction: column; gap: 12px; text-align: center; }
  #menu h1 { margin: 0; font-size: 42px; letter-spacing: 2px; }
  #menu p { margin: 0; opacity: .85; max-width: 560px; }
  #menu button { padding: 12px 30px; font-size: 18px; border: none; border-radius: 10px; cursor: pointer; background: #4caf50; color: #fff; font-weight: bold; }
  #menu button:hover { background: #66bb6a; }
  #hudModes { position: fixed; top: 10px; right: 10px; color: #fff; text-shadow: 0 0 4px #000; z-index: 10; font-size: 12px; text-align: right; }
</style>
</head>
<body>
<div id="crosshair"></div>
<div id="hotbar"></div>
<div id="info"></div>
<div id="hudModes"></div>
<div id="menu">
  <h1>VoxelCraft</h1>
  <p>A browser-based Minecraft-style voxel world. Click to play. WASD to move, Space jump, mouse look, left click break, right click place, scroll / 1-9 select block, C toggle creative/survival.</p>
  <button id="startBtn">Play</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

// ---------- Config ----------
const WORLD_SIZE = 64;
const WORLD_HEIGHT = 80;
const WATER_LEVEL = 24;
const CHUNK_SIZE = 16;
const RENDER_DISTANCE = 3;
const PLAYER_RADIUS = 0.28;
const PLAYER_HEIGHT = 1.7;
const EYE_HEIGHT = 1.6;

const BLOCK = {
  AIR:0, GRASS:1, DIRT:2, STONE:3, COBBLE:4, SAND:5, WATER:6,
  WOOD:7, LEAVES:8, PLANKS:9, GLASS:10
};

const BLOCK_NAMES = {
  1:'Grass', 2:'Dirt', 3:'Stone', 4:'Cobble', 5:'Sand',
  7:'Wood', 8:'Leaves', 9:'Planks', 10:'Glass'
};

// material color definitions: index -> {color, transparent, opacity}
const MAT = [
  { color: 0x5db85d, transparent: false }, // 0 grass top
  { color: 0x7b5e3a, transparent: false }, // 1 grass side
  { color: 0x8b5a2b, transparent: false }, // 2 dirt
  { color: 0x7d7d7d, transparent: false }, // 3 stone
  { color: 0x6b6b6b, transparent: false }, // 4 cobble
  { color: 0xd7c89a, transparent: false }, // 5 sand
  { color: 0x3399ff, transparent: true,  opacity: 0.55 }, // 6 water
  { color: 0x8b6f47, transparent: false }, // 7 wood
  { color: 0x3a8a3a, transparent: false }, // 8 leaves
  { color: 0xb5885a, transparent: false }, // 9 planks
  { color: 0xaadfff, transparent: true,  opacity: 0.35 }, // 10 glass
];

// block -> per-face material index (by direction order: 0=+x,1=-x,2=+y,3=-y,4=+z,5=-z)
function faceMat(block, dir) {
  switch (block) {
    case BLOCK.GRASS:
      if (dir === 2) return 0; // top
      if (dir === 3) return 2; // bottom dirt
      return 1; // side
    case BLOCK.DIRT: return 2;
    case BLOCK.STONE: return 3;
    case BLOCK.COBBLE: return 4;
    case BLOCK.SAND: return 5;
    case BLOCK.WATER: return 6;
    case BLOCK.WOOD: return 7;
    case BLOCK.LEAVES: return 8;
    case BLOCK.PLANKS: return 9;
    case BLOCK.GLASS: return 10;
    default: return 3;
  }
}

const DIRS = [
  { dx:1,dy:0,dz:0, n:[1,0,0] },
  { dx:-1,dy:0,dz:0, n:[-1,0,0] },
  { dx:0,dy:1,dz:0, n:[0,1,0] },
  { dx:0,dy:-1,dz:0, n:[0,-1,0] },
  { dx:0,dy:0,dz:1, n:[0,0,1] },
  { dx:0,dy:0,dz:-1, n:[0,0,-1] },
];

function faceVerts(blockX, blockY, blockZ, dir) {
  const x=blockX, y=blockY, z=blockZ;
  switch (dir) {
    case 0: // +x
      return [[x+1,y,z],[x+1,y,z+1],[x+1,y+1,z+1],[x+1,y+1,z]];
    case 1: // -x
      return [[x,y,z+1],[x,y,z],[x,y+1,z],[x,y+1,z+1]];
    case 2: // +y top
      return [[x,y+1,z],[x+1,y+1,z],[x+1,y+1,z+1],[x,y+1,z+1]];
    case 3: // -y bottom
      return [[x,y,z+1],[x+1,y,z+1],[x+1,y,z],[x,y,z]];
    case 4: // +z
      return [[x,y,z+1],[x+1,y,z+1],[x+1,y+1,z+1],[x,y+1,z+1]];
    case 5: // -z
      return [[x+1,y,z],[x,y,z],[x,y+1,z],[x+1,y+1,z]];
  }
}

const UV = [[0,0],[1,0],[1,1],[0,1]];

// ---------- Noise ----------
class Noise {
  constructor(seed=12345) {
    this.perm = new Uint8Array(512);
    const p = new Uint8Array(256);
    for (let i=0;i<256;i++) p[i]=i;
    // Fisher-yates with seeded rng
    let s = seed >>> 0;
    const rand = () => { s = (s*1664525+1013904223) >>> 0; return s/0xffffffff; };
    for (let i=255;i>0;i--) {
      const j = Math.floor(rand()*(i+1));
      const t = p[i]; p[i]=p[j]; p[j]=t;
    }
    for (let i=0;i<512;i++) this.perm[i]=p[i&255];
  }
  fade(t){return t*t*t*(t*(t*6-15)+10);}
  lerp(a,b,t){return a+(b-a)*t;}
  grad(hash,x,y,z){
    const h=hash&15;
    const u=h<8?x:y, v=h<4?y:h===12||h===14?x:z;
    return ((h&1)?-u:u)+((h&2)?-v:v);
  }
  noise3D(x,y,z){
    const X=Math.floor(x)&255, Y=Math.floor(y)&255, Z=Math.floor(z)&255;
    x-=Math.floor(x); y-=Math.floor(y); z-=Math.floor(z);
    const u=this.fade(x), v=this.fade(y), w=this.fade(z);
    const A=this.perm[X]+Y, AA=this.perm[A]+Z, AB=this.perm[A+1]+Z;
    const B=this.perm[X+1]+Y, BA=this.perm[B]+Z, BB=this.perm[B+1]+Z;
    return this.lerp(
      this.lerp(this.lerp(this.grad(this.perm[AA],x,y,z),this.grad(this.perm[BA],x-1,y,z),u),
              this.lerp(this.grad(this.perm[AB],x,y-1,z),this.grad(this.perm[BB],x-1,y-1,z),u),v),
      this.lerp(this.lerp(this.grad(this.perm[AA+1],x,y,z-1),this.grad(this.perm[BA+1],x-1,y,z-1),u),
              this.lerp(this.grad(this.perm[AB+1],x,y-1,z-1),this.grad(this.perm[BB+1],x-1,y-1,z-1),u),v),w);
  }
  noise2D(x,y){ return this.noise3D(x,0,y); }
  fbm(x,y,oct=5){ let v=0,a=1,f=1,s=0; for(let i=0;i<oct;i++){v+=this.noise2D(x*f,y*f)*a; s+=a; a*=0.5; f*=2;} return v/s; }
  fbm3D(x,y,z,oct=4){ let v=0,a=1,f=1,s=0; for(let i=0;i<oct;i++){v+=this.noise3D(x*f,y*f,z*f)*a; s+=a; a*=0.5; f*=2;} return v/s; }
}

// ---------- World data ----------
const noise = new Noise(42);
let world = new Uint8Array(WORLD_SIZE*WORLD_SIZE*WORLD_HEIGHT);

function idx(x,y,z){ return (y*WORLD_SIZE*WORLD_SIZE) + (z*WORLD_SIZE) + x; }

function inBounds(x,y,z){
  return x>=0 && y>=0 && z>=0 && x<WORLD_SIZE && y<WORLD_HEIGHT && z<WORLD_SIZE;
}

function getBlock(x,y,z){
  if (!inBounds(x,y,z)) return BLOCK.AIR;
  return world[idx(x,y,z)];
}
function setBlock(x,y,z,type){
  if (!inBounds(x,y,z)) return;
  world[idx(x,y,z)] = type;
}

// Generate terrain
function generateWorld(){
  // heightmap
  const heights = new Int16Array(WORLD_SIZE*WORLD_SIZE);
  for (let z=0;z<WORLD_SIZE;z++){
    for (let x=0;x<WORLD_SIZE;x++){
      const n = noise.fbm(x*0.012, z*0.012, 5);
      let h = Math.floor(WATER_LEVEL - 2 + n*12);
      // extra hills
      h += Math.floor(noise.fbm(x*0.04,z*0.04,3)*4);
      h = Math.max(3, Math.min(WORLD_HEIGHT-10, h));
      heights[z*WORLD_SIZE+x] = h;
    }
  }
  for (let z=0;z<WORLD_SIZE;z++){
    for (let x=0;x<WORLD_SIZE;x++){
      const h = heights[z*WORLD_SIZE+x];
      for (let y=0;y<=h;y++){
        if (y === h) {
          if (h < WATER_LEVEL - 1) setBlock(x,y,z, BLOCK.SAND);
          else setBlock(x,y,z, BLOCK.GRASS);
        } else if (y >= h-3) {
          if (h < WATER_LEVEL - 1) setBlock(x,y,z, BLOCK.SAND);
          else setBlock(x,y,z, BLOCK.DIRT);
        } else {
          setBlock(x,y,z, BLOCK.STONE);
        }
      }
      // water
      if (h < WATER_LEVEL - 1) {
        for (let y=h+1;y<WATER_LEVEL;y++) setBlock(x,y,z, BLOCK.WATER);
      }
    }
  }
  // caves
  for (let z=0;z<WORLD_SIZE;z++){
    for (let x=0;x<WORLD_SIZE;x++){
      for (let y=2;y<WORLD_HEIGHT-5;y++){
        const b = getBlock(x,y,z);
        if (b===BLOCK.STONE || b===BLOCK.DIRT){
          const n = noise.fbm3D(x*0.06, y*0.06, z*0.06, 4);
          if (n > 0.55) setBlock(x,y,z, BLOCK.AIR);
        }
      }
    }
  }
  // trees
  for (let z=2;z<WORLD_SIZE-2;z++){
    for (let x=2;x<WORLD_SIZE-2;x++){
      const hIdx = z*WORLD_SIZE+x;
      const h = heights[hIdx];
      if (h >= WATER_LEVEL && getBlock(x,h,z)===BLOCK.GRASS) {
        if (Math.random() < 0.018) {
          const trunkH = 4 + Math.floor(Math.random()*3);
          for (let i=1;i<=trunkH;i++) setBlock(x,h+i,z, BLOCK.WOOD);
          const ty = h+trunkH;
          for (let dy=-2;dy<=2;dy++){
            for (let dx=-2;dx<=2;dx++){
              for (let dz=-2;dz<=2;dz++){
                if (dx*dx+dy*dy+dz*dz > 7) continue;
                if (getBlock(x+dx,ty+dy,z+dz)===BLOCK.AIR) setBlock(x+dx,ty+dy,z+dz, BLOCK.LEAVES);
              }
            }
          }
        }
      }
    }
  }
}

// ---------- Persistence ----------
function arrayToBase64(arr){
  let binary='';
  const chunk=0x8000;
  for (let i=0;i<arr.length;i+=chunk){
    binary += String.fromCharCode.apply(null, arr.subarray(i,i+chunk));
  }
  return btoa(binary);
}
function base64ToArray(b64){
  const binary=atob(b64);
  const arr=new Uint8Array(binary.length);
  for (let i=0;i<binary.length;i++) arr[i]=binary.charCodeAt(i);
  return arr;
}

function saveWorld(){
  try {
    localStorage.setItem('voxelcraft_world_v2', arrayToBase64(world));
    localStorage.setItem('voxelcraft_player_v2', JSON.stringify({
      x: player.pos.x, y: player.pos.y, z: player.pos.z,
      yaw: controls.getObject().rotation.y,
      pitch: camera.rotation.x,
      selected: selectedSlot,
      creative
    }));
  } catch(e){}
}

function loadWorld(){
  const saved = localStorage.getItem('voxelcraft_world_v2');
  if (saved) {
    try {
      const arr = base64ToArray(saved);
      if (arr.length === world.length) { world = arr; return true; }
    } catch(e){}
  }
  generateWorld();
  return false;
}

// ---------- Three.js scene ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 60, 120);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 300);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const ambient = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xfff3d6, 0.9);
sun.position.set(100, 120, 50);
scene.add(sun);

const controls = new PointerLockControls(camera, document.body);
scene.add(controls.getObject());

// Materials (shared)
const materials = MAT.map(m => new THREE.MeshLambertMaterial({
  color: m.color,
  transparent: !!m.transparent,
  opacity: m.opacity ?? 1,
  side: THREE.DoubleSide,
}));

// ---------- Chunks ----------
const loadedChunks = new Map(); // key -> { meshes:[], waterMesh }

function chunkKey(cx,cz){ return cx+','+cz; }

function worldToChunk(v){ return Math.floor(v/CHUNK_SIZE); }

function buildChunk(cx, cz) {
  const originX = cx*CHUNK_SIZE;
  const originZ = cz*CHUNK_SIZE;
  const perMat = {}; // matIndex -> {pos,norm,uv,idx}
  const water = {pos:[],norm:[],uv:[],idx:[]};

  const ensureMat = (m) => {
    if (!perMat[m]) perMat[m]={pos:[],norm:[],uv:[],idx:[]};
    return perMat[m];
  };

  for (let lz=0;lz<CHUNK_SIZE;lz++){
    for (let lx=0;lx<CHUNK_SIZE;lx++){
      for (let y=0;y<WORLD_HEIGHT;y++){
        const x = originX+lx;
        const z = originZ+lz;
        if (!inBounds(x,y,z)) continue;
        const b = getBlock(x,y,z);
        if (b === BLOCK.AIR) continue;
        if (b === BLOCK.WATER) {
          // water faces only toward air
          for (let d=0; d<6; d++) {
            const dir=DIRS[d];
            const nx=x+dir.dx, ny=y+dir.dy, nz=z+dir.dz;
            const nb = getBlock(nx,ny,nz);
            if (nb === BLOCK.AIR) {
              addFace(water, x,y,z, d);
            }
          }
        } else {
          // solid
          for (let d=0; d<6; d++) {
            const dir=DIRS[d];
            const nx=x+dir.dx, ny=y+dir.dy, nz=z+dir.dz;
            const nb = getBlock(nx,ny,nz);
            if (nb === BLOCK.AIR || nb === BLOCK.WATER) {
              const m = faceMat(b, d);
              addFace(ensureMat(m), x,y,z, d);
            }
          }
        }
      }
    }
  }

  function addFace(collect, x,y,z, dir) {
    const vs = faceVerts(x,y,z,dir);
    const base = collect.pos.length/3;
    for (let i=0;i<4;i++){
      collect.pos.push(vs[i][0], vs[i][1], vs[i][2]);
      collect.norm.push(DIRS[dir].n[0], DIRS[dir].n[1], DIRS[dir].n[2]);
      collect.uv.push(UV[i][0], UV[i][1]);
    }
    collect.idx.push(base, base+1, base+2, base, base+2, base+3);
  }

  const meshes = [];
  for (const mStr in perMat) {
    const m = +mStr;
    const c = perMat[m];
    if (c.idx.length === 0) continue;
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(c.pos,3));
    geo.setAttribute('normal', new THREE.Float32BufferAttribute(c.norm,3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(c.uv,2));
    geo.setIndex(c.idx);
    geo.computeBoundingSphere();
    const mesh = new THREE.Mesh(geo, materials[m]);
    meshes.push(mesh);
    scene.add(mesh);
  }
  let waterMesh = null;
  if (water.idx.length > 0) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(water.pos,3));
    geo.setAttribute('normal', new THREE.Float32BufferAttribute(water.norm,3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(water.uv,2));
    geo.setIndex(water.idx);
    geo.computeBoundingSphere();
    waterMesh = new THREE.Mesh(geo, materials[6]);
    waterMesh.renderOrder = 10;
    scene.add(waterMesh);
  }
  loadedChunks.set(chunkKey(cx,cz), { meshes, waterMesh });
}

// Actually rebuild loadedChunks correctly (fix duplicate): redo cleanly
loadedChunks.clear();

function disposeChunk(cx,cz){
  const key = chunkKey(cx,cz);
  const entry = loadedChunks.get(key);
  if (!entry) return;
  for (const mesh of entry.meshes) {
    scene.remove(mesh);
    if (mesh.geometry) mesh.geometry.dispose();
  }
  if (entry.waterMesh) {
    scene.remove(entry.waterMesh);
    entry.waterMesh.geometry.dispose();
  }
  loadedChunks.delete(key);
}

function rebuildChunk(cx,cz){
  disposeChunk(cx,cz);
  buildChunk(cx,cz);
}

function updateChunks() {
  const px = controls.getObject().position.x;
  const pz = controls.getObject().position.z;
  const pcx = worldToChunk(px);
  const pcz = worldToChunk(pz);
  const keep = new Set();
  for (let dx=-RENDER_DISTANCE; dx<=RENDER_DISTANCE; dx++){
    for (let dz=-RENDER_DISTANCE; dz<=RENDER_DISTANCE; dz++){
      const cx=pcx+dx, cz=pcz+dz;
      if (cx<0||cz<0||cx>=Math.ceil(WORLD_SIZE/CHUNK_SIZE)||cz>=Math.ceil(WORLD_SIZE/CHUNK_SIZE)) continue;
      const key=chunkKey(cx,cz);
      keep.add(key);
      if (!loadedChunks.has(key)) buildChunk(cx,cz);
    }
  }
  // unload
  for (const key of [...loadedChunks.keys()]) {
    if (!keep.has(key)) {
      const [cx,cz] = key.split(',').map(Number);
      disposeChunk(cx,cz);
    }
  }
}

// messy duplicate buildChunk fixed by rewriting file segment? We'll keep above (buildChunk sets entry once at end after clear? Actually we called clear). Need ensure buildChunk registers. It does at end. Good.

// ---------- Player ----------
const player = {
  pos: new THREE.Vector3(),
  vel: new THREE.Vector3(),
  onGround: false,
  creative: true,
};

function isSolid(x,y,z){
  const b = getBlock(Math.floor(x), Math.floor(y), Math.floor(z));
  return b !== BLOCK.AIR && b !== BLOCK.WATER;
}

function collides(pos){
  const minX = Math.floor(pos.x - PLAYER_RADIUS);
  const maxX = Math.floor(pos.x + PLAYER_RADIUS);
  const minY = Math.floor(pos.y);
  const maxY = Math.floor(pos.y + PLAYER_HEIGHT);
  const minZ = Math.floor(pos.z - PLAYER_RADIUS);
  const maxZ = Math.floor(pos.z + PLAYER_RADIUS);
  for (let x=minX;x<=maxX;x++)
  for (let y=minY;y<=maxY;y++)
  for (let z=minZ;z<=maxZ;z++){
    if (isSolid(x,y,z)) return true;
  }
  return false;
}

// ---------- Input ----------
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code.startsWith('Digit')) {
    const n = parseInt(e.code.replace('Digit',''));
    if (n>=1 && n<=9) { selectedSlot = n-1; updateHotbarUI(); }
  }
  if (e.code === 'KeyC') { player.creative = !player.creative; updateHUD(); }
  if (e.code === 'Escape') { if (controls.isLocked) controls.unlock(); }
});
window.addEventListener('keyup', e => { keys[e.code]=false; });

let mining = false;
let placing = false;
document.addEventListener('mousedown', e => {
  if (!controls.isLocked) return;
  if (e.button===0) { mining=true; tryMine(); }
  if (e.button===2) { placing=true; tryPlace(); }
});
document.addEventListener('mouseup', e => {
  if (e.button===0) mining=false;
  if (e.button===2) placing=false;
});
document.addEventListener('contextmenu', e=>e.preventDefault());

window.addEventListener('wheel', e => {
  selectedSlot = (selectedSlot + (e.deltaY>0?1:-1) + 9) % 9;
  updateHotbarUI();
}, {passive:true});

// ---------- Hotbar ----------
const hotbarTypes = [BLOCK.GRASS,BLOCK.DIRT,BLOCK.STONE,BLOCK.COBBLE,BLOCK.SAND,BLOCK.WOOD,BLOCK.PLANKS,BLOCK.LEAVES,BLOCK.GLASS];
const inventory = hotbarTypes.map(() => ({count: 64}));
let selectedSlot = 0;
let creative = true;
player.creative = true;

function getSelectedType(){ return hotbarTypes[selectedSlot]; }

// map block->icons (color)
function blockColor(b){
  if (b===BLOCK.GRASS) return 0x5db85d;
  if (b===BLOCK.DIRT) return 0x8b5a2b;
  if (b===BLOCK.STONE) return 0x7d7d7d;
  if (b===BLOCK.COBBLE) return 0x6b6b6b;
  if (b===BLOCK.SAND) return 0xd7c89a;
  if (b===BLOCK.WOOD) return 0x8b6f47;
  if (b===BLOCK.PLANKS) return 0xb5885a;
  if (b===BLOCK.LEAVES) return 0x3a8a3a;
  if (b===BLOCK.GLASS) return 0xaadfff;
  if (b===BLOCK.WATER) return 0x3399ff;
  return 0xffffff;
}

function updateHotbarUI(){
  const hb = document.getElementById('hotbar');
  hb.innerHTML = '';
  hotbarTypes.forEach((t,i) => {
    const slot = document.createElement('div');
    slot.className = 'slot' + (i===selectedSlot?' selected':'');
    slot.innerHTML = `
      <span class="num">${i+1}</span>
      <div class="icon" style="background:#${blockColor(t).toString(16).padStart(6,'0')}"></div>
      <span class="label">${BLOCK_NAMES[t]}</span>`;
    slot.onclick = () => { selectedSlot=i; updateHotbarUI(); };
    hb.appendChild(slot);
  });
}
updateHotbarUI();

function updateHUD(){
  document.getElementById('hudModes').innerText =
    `Mode: ${player.creative?'Creative':'Survival'}\nBlocks: ${inventory[selectedSlot].count}`;
}

// ---------- Mine / Place ----------
const raycaster = new THREE.Raycaster();
const centerVec = new THREE.Vector2(0,0);

function getHit(){
  raycaster.setFromCamera(centerVec, camera);
  // collect all chunk meshes
  const meshes = [];
  for (const e of loadedChunks.values()) meshes.push(...e.meshes);
  const hits = raycaster.intersectObjects(meshes, false);
  // filter water? allow
  if (hits.length===0) return null;
  return hits[0];
}

function tryMine(){
  const hit = getHit();
  if (!hit) return;
  const p = hit.point; const n = hit.face.normal;
  const bx = Math.floor(p.x - n.x*0.1);
  const by = Math.floor(p.y - n.y*0.1);
  const bz = Math.floor(p.z - n.z*0.1);
  const t = getBlock(bx,by,bz);
  if (t === BLOCK.AIR || t === BLOCK.WATER) return;
  setBlock(bx,by,bz,BLOCK.AIR);
  if (!player.creative) {
    // add to inventory if matching slot
    const idx = hotbarTypes.indexOf(t);
    if (idx>=0) inventory[idx].count++;
  }
  // rebuild chunks
  rebuildChunksFor(bx,by,bz);
  updateHUD();
}

function tryPlace(){
  const hit = getHit();
  if (!hit) return;
  const p = hit.point; const n = hit.face.normal;
  const bx = Math.floor(p.x + n.x*0.1);
  const by = Math.floor(p.y + n.y*0.1);
  const bz = Math.floor(p.z + n.z*0.1);
  if (!inBounds(bx,by,bz)) return;
  if (getBlock(bx,by,bz) !== BLOCK.AIR) return;
  // don't place inside player
  const nx=bx+0.5, ny=by, nz=bz+0.5;
  const dx = controls.getObject().position.x - nx;
  const dz = controls.getObject().position.z - nz;
  const dy = controls.getObject().position.y - ny;
  if (Math.abs(dx)<0.8 && Math.abs(dz)<0.8 && dy>-1 && dy<2) return;
  const type = getSelectedType();
  if (!player.creative && inventory[selectedSlot].count<=0) return;
  setBlock(bx,by,bz,type);
  if (!player.creative) inventory[selectedSlot].count--;
  rebuildChunksFor(bx,by,bz);
  updateHUD();
}

function rebuildChunksFor(x,y,z){
  const chunks = new Set();
  const add = (cx,cz) => chunks.add(cx+','+cz);
  add(worldToChunk(x), worldToChunk(z));
  // neighbors on boundaries
  const locals = [[x-1,y,z],[x+1,y,z],[x,y,z-1],[x,y,z+1],[x,y-1,z],[x,y+1,z]];
  for (const [nx,ny,nz] of locals) {
    if (!inBounds(nx,ny,nz)) continue;
    add(worldToChunk(nx), worldToChunk(nz));
  }
  for (const key of chunks) {
    const [cx,cz] = key.split(',').map(Number);
    // only if loaded
    if (loadedChunks.has(key)) rebuildChunk(cx,cz);
  }
  updateChunks();
}

// hold mining
setInterval(() => {
  if (mining && controls.isLocked) tryMine();
}, 180);

// ---------- Main loop ----------
const clock = new THREE.Clock();
let lastSave = 0;

function animate(){
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.05);
  if (controls.isLocked) {
    // movement input
    const speed = keys['ShiftLeft'] ? 9 : 5;
    const input = new THREE.Vector3();
    if (keys['KeyW']) input.z -= 1;
    if (keys['KeyS']) input.z += 1;
    if (keys['KeyA']) input.x -= 1;
    if (keys['KeyD']) input.x += 1;
    if (input.length() > 0) input.normalize(); else input.set(0,0,0);
    // transform by camera yaw
    const yaw = controls.getObject().rotation.y;
    const fx = Math.sin(yaw), fz = Math.cos(yaw); // forward? three pointerlock forward is -z in local
    // local to world
    const worldX = input.x*Math.cos(yaw) + input.z*Math.sin(yaw);
    const worldZ = -input.x*Math.sin(yaw) + input.z*Math.cos(yaw);
    // Actually simpler: use camera direction
    player.vel.x = worldX * speed;
    player.vel.z = worldZ * speed;
    // gravity
    player.vel.y -= 22 * delta;
    if (keys['Space'] && player.onGround) { player.vel.y = 9; player.onGround=false; }

    // move X
    player.pos.x += player.vel.x*delta;
    if (collides(player.pos)) { player.pos.x -= player.vel.x*delta; player.vel.x=0; }
    // move Z
    player.pos.z += player.vel.z*delta;
    if (collides(player.pos)) { player.pos.z -= player.vel.z*delta; player.vel.z=0; }
    // move Y
    player.onGround = false;
    player.pos.y += player.vel.y*delta;
    if (collides(player.pos)) {
      if (player.vel.y < 0) player.onGround = true;
      player.pos.y -= player.vel.y*delta;
      player.vel.y = 0;
    }

    controls.getObject().position.copy(player.pos);
    controls.getObject().position.y += EYE_HEIGHT;
  }

  updateChunks();

  // info
  const p = controls.getObject().position;
  const bx=Math.floor(p.x), by=Math.floor(p.y-EYE_HEIGHT), bz=Math.floor(p.z);
  document.getElementById('info').innerText =
    `XYZ: ${bx}, ${by}, ${bz}\nFPS: ${Math.round(1/delta)}\nSelected: ${BLOCK_NAMES[getSelectedType()]}`;

  if (creative !== player.creative) { creative = player.creative; updateHUD(); }
  updateHUD();

  // periodic save
  if (Date.now()-lastSave > 5000) { saveWorld(); lastSave=Date.now(); }

  window.frameCount = (window.frameCount||0)+1;
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// start
document.getElementById('startBtn').addEventListener('click', () => {
  document.getElementById('menu').style.display = 'none';
  controls.lock();
});

controls.addEventListener('unlock', () => {
  // show menu? keep hidden; allow click to lock again
});

document.body.addEventListener('click', () => {
  if (!controls.isLocked && document.getElementById('menu').style.display==='none') controls.lock();
});

// Load or generate
const hadSave = loadWorld();

// init player pos
const ps = localStorage.getItem('voxelcraft_player_v2');
if (ps) {
  try {
    const d = JSON.parse(ps);
    player.pos.set(d.x,d.y,d.z);
    player.creative = (d.creative !== false);
    creative = player.creative;
    if (typeof d.selected === 'number') selectedSlot = d.selected;
    updateHotbarUI();
    // set look
    controls.getObject().rotation.y = d.yaw||0;
    camera.rotation.x = d.pitch||0;
  } catch(e){}
} else {
  // find spawn height (top-down)
  let sx = 32, sz = 32, sy = 32;
  let found = false;
  for (let x=0;x<WORLD_SIZE && !found;x++){
    for (let z=0;z<WORLD_SIZE && !found;z++){
      for (let y=WORLD_HEIGHT-1;y>2 && !found;y--){
        if (getBlock(x,y,z)===BLOCK.GRASS && getBlock(x,y+1,z)===BLOCK.AIR) {
          sx=x; sz=z; sy=y; found=true;
        }
      }
    }
  }
  player.pos.set(sx, sy+1, sz);
}
controls.getObject().position.copy(player.pos);
controls.getObject().position.y += EYE_HEIGHT;

updateChunks();
animate();

window.scene=scene; window.renderer=renderer; window.loadedChunks=loadedChunks; window.player=player; window.world=world; window.camera=camera; window.getBlock=getBlock; window.setBlock=setBlock; window.controls=controls;
window.addEventListener('beforeunload', saveWorld);
</script>
</body>
